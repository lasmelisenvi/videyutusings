    <style>
        :root {
            --bg-dark: #090d16;
            --border-color: rgba(255, 255, 255, 0.1);
            --accent-primary: #3b82f6;
            --accent-secondary: #8b5cf6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            overflow-x: hidden;
            position: relative;
        }

        .bg-glow {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            filter: blur(130px);
            opacity: 0.25;
            z-index: 0;
            pointer-events: none;
        }

        .glow-1 { background: var(--accent-primary); top: -10%; left: -10%; }
        .glow-2 { background: var(--accent-secondary); bottom: -10%; right: -10%; }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 920px;
            text-align: center;
        }

        .badge {
            display: inline-block;
            padding: 0.4rem 1rem;
            border-radius: 9999px;
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: #60a5fa;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 1.25rem;
            text-transform: uppercase;
        }

        h1 {
            font-size: clamp(1.8rem, 4vw, 2.8rem);
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 1rem;
            background: linear-gradient(to right, #ffffff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.05rem;
            max-width: 650px;
            margin: 0 auto 2.5rem auto;
            line-height: 1.6;
        }

        .video-wrapper-outer {
            position: relative;
            padding: 12px;
            border-radius: 24px;
            background: linear-gradient(145deg, rgba(255,255,255,0.12), rgba(255,255,255,0.02));
            border: 1px solid var(--border-color);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7),
                        0 0 40px rgba(59, 130, 246, 0.15);
            backdrop-filter: blur(10px);
        }

        .video-wrapper-outer::before {
            content: "";
            position: absolute;
            inset: -1px;
            border-radius: 24px;
            padding: 1px;
            background: linear-gradient(135deg, var(--accent-primary), transparent 40%, var(--accent-secondary));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .video-responsive {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 14px;
            background-color: #000;
        }

        .video-responsive iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        footer {
            margin-top: 2.5rem;
            color: var(--text-muted);
            font-size: 0.85rem;
        }
    </style>
</head>

    <!-- =================================================================
         2. CONFIGURACIÓN DEL VIDEO DE YOUTUBE
         Pega el enlace completo de tu video entre las comillas de abajo.
    ================================================================== -->
    <script>
        const URL_DEL_VIDEO = "https://www.youtube.com/watch?v=n3ICQ_r1pWw";

        function cargarVideo(url) {
            // Extrae el ID desde cualquier formato de enlace de YouTube
            const regExp = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?|shorts)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/;
            const match = url.match(regExp);
            const videoId = (match && match[1]) ? match[1] : url.trim();

            document.getElementById('yt-player').src = `https://www.youtube.com/embed/${videoId}?rel=0&modestbranding=1`;
        }

        cargarVideo(URL_DEL_VIDEO);
    </script>
